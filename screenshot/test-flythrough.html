<title>flythrough test</title>
<style>
  html,body{ margin:0; background:#050507; font-family:sans-serif; color:#fff }
  #bg{ position:fixed; inset:0; z-index:0 }
  .scroller{ position:relative; z-index:1 }
  section{ height:100vh; display:flex; align-items:center; padding:0 60px; box-sizing:border-box }
  .solid{ background:#050507 }
  h2{ font-size:42px; max-width:400px }
  .marker{ position:fixed; top:10px; left:10px; z-index:5; background:#000; padding:6px 10px; font-family:monospace; font-size:12px }
</style>
<body>
<canvas id="bg"></canvas>
<div class="marker" id="marker">progress: 0</div>
<div class="scroller">
  <section id="s0"><h2>Waypoint 0 — hero</h2></section>
  <section id="s1"><h2>Waypoint 1 — escucha</h2></section>
  <section id="s2"><h2>Waypoint 2 — interpreta</h2></section>
  <section id="s3"><h2>Waypoint 3 — genera</h2></section>
  <section class="solid"><h2>Sección normal después (fondo sólido, debe tapar el canvas)</h2></section>
</div>
<script src="./three.min.js"></script>
<script>
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
  var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg'), antialias:true, alpha:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));

  scene.add(new THREE.AmbientLight(0x201033, 1.5));
  var l1 = new THREE.PointLight(0x8b5cf6, 50, 30); scene.add(l1);
  var l2 = new THREE.PointLight(0x22d3ee, 40, 30); scene.add(l2);

  // waypoints in 3D space (camera positions + lookAt targets)
  var waypoints = [
    { cam: [0,0,6],   look: [0,0,0] },
    { cam: [3,1,4],   look: [2,0.5,0] },
    { cam: [-3,-1,3], look: [-2,0,1] },
    { cam: [0,2,-2],  look: [0,0,-4] },
  ];

  // an object at each waypoint's "look" target so there's something to see
  var mats = [0x8b5cf6, 0x22d3ee, 0xf472b6, 0xa78bfa];
  waypoints.forEach(function(wp, i){
    var geo = i === 0 ? new THREE.IcosahedronGeometry(1.4, 4) : new THREE.TorusKnotGeometry(0.6, 0.2, 100, 16);
    var mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: mats[i], emissive: mats[i], emissiveIntensity: 0.4, roughness:0.3, metalness:0.5 }));
    mesh.position.set(wp.look[0], wp.look[1], wp.look[2]);
    mesh.userData.spin = 0.3 + i*0.1;
    scene.add(mesh);
    wp.mesh = mesh;
  });

  function lerp(a,b,t){ return a + (b-a)*t; }
  function lerpVec(a,b,t){ return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; }

  function getScrollProgress(){
    var scroller = document.querySelector('.scroller');
    var flyHeight = document.getElementById('s3').getBoundingClientRect().bottom + window.scrollY - document.getElementById('s0').getBoundingClientRect().top - window.scrollY;
    var s0Top = document.getElementById('s0').offsetTop;
    var s3Bottom = document.getElementById('s3').offsetTop + document.getElementById('s3').offsetHeight;
    var total = s3Bottom - s0Top;
    var passed = window.scrollY - s0Top;
    return Math.max(0, Math.min(1, passed / total));
  }

  var clock = new THREE.Clock();
  function frame(){
    var t = clock.getElapsedTime();
    var p = getScrollProgress();
    document.getElementById('marker').textContent = 'progress: ' + p.toFixed(2);

    // map p (0-1) across N-1 segments between waypoints
    var segCount = waypoints.length - 1;
    var segF = p * segCount;
    var segI = Math.min(segCount - 1, Math.floor(segF));
    var segT = segF - segI;
    var a = waypoints[segI], b = waypoints[segI+1];
    var camPos = lerpVec(a.cam, b.cam, segT);
    var lookPos = lerpVec(a.look, b.look, segT);
    camera.position.set(camPos[0], camPos[1], camPos[2]);
    camera.lookAt(lookPos[0], lookPos[1], lookPos[2]);

    l1.position.copy(camera.position);
    l2.position.set(Math.sin(t*0.3)*5, Math.cos(t*0.3)*5, 2);

    waypoints.forEach(function(wp){
      wp.mesh.rotation.y = t * wp.mesh.userData.spin;
      wp.mesh.rotation.x = t * wp.mesh.userData.spin * 0.6;
    });

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();

  window.addEventListener('resize', function(){
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
</script>
